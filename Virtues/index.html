<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 13 Virtues System - Interactive Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8b5cf6;
            --primary-dark: #6d28d9;
            --secondary: #ec4899;
            --accent: #f59e0b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-light: #f9fafb;
            --bg-dark: #111827;
            --surface-light: #ffffff;
            --surface-dark: #1f2937;
            --text-light: #1f2937;
            --text-dark: #f9fafb;
            --border-light: #e5e7eb;
            --border-dark: #374151;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
            }
            body {
                background-color: var(--bg-dark);
                color: var(--text-dark);
            }
            .surface {
                background-color: var(--surface-dark);
                border-color: var(--border-dark);
            }
            .card {
                background-color: var(--surface-dark);
                border-color: var(--border-dark);
            }
            input, textarea, select {
                background-color: #374151;
                color: var(--text-dark);
                border-color: var(--border-dark);
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
            }
            body {
                background-color: var(--bg-light);
                color: var(--text-light);
            }
            .surface {
                background-color: var(--surface-light);
                border-color: var(--border-light);
            }
            .card {
                background-color: var(--surface-light);
                border-color: var(--border-light);
            }
            input, textarea, select {
                background-color: #f3f4f6;
                color: var(--text-light);
                border-color: var(--border-light);
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 2px solid var(--primary);
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.2em;
            opacity: 0.8;
            font-style: italic;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .harmony-card {
            grid-column: 1 / -1;
            padding: 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 15px;
            color: white;
            text-align: center;
        }

        .harmony-score {
            font-size: 3.5em;
            font-weight: bold;
            margin: 20px 0;
        }

        .harmony-label {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--accent));
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .virtues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .virtue-card {
            padding: 25px;
            border-radius: 12px;
            border: 2px solid var(--border-light);
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: var(--surface-light);
        }

        @media (prefers-color-scheme: dark) {
            .virtue-card {
                background-color: var(--surface-dark);
                border-color: var(--border-dark);
            }
        }

        .virtue-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
            border-color: var(--primary);
        }

        .virtue-card.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
        }

        .virtue-number {
            display: inline-block;
            width: 35px;
            height: 35px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 35px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .virtue-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .virtue-subtitle {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 15px;
            font-style: italic;
        }

        .virtue-description {
            font-size: 0.95em;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .virtue-score {
            background-color: rgba(139, 92, 246, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .score-label {
            font-size: 0.85em;
            opacity: 0.7;
        }

        .score-value {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
        }

        .virtue-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: scale(1.05);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #be185d;
            transform: scale(1.05);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8em;
            min-width: auto;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: var(--surface-light);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            .modal-content {
                background-color: var(--surface-dark);
            }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary);
        }

        .modal-header h2 {
            color: var(--primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-light);
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        @media (prefers-color-scheme: dark) {
            input, textarea, select {
                border-color: var(--border-dark);
            }
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .recommendations {
            background-color: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .recommendations h3 {
            color: var(--success);
            margin-bottom: 10px;
        }

        .recommendations ul {
            list-style-position: inside;
            opacity: 0.9;
        }

        .recommendations li {
            margin-bottom: 8px;
        }

        .stats-section {
            margin-top: 40px;
            padding: 30px;
            background-color: var(--surface-light);
            border-radius: 15px;
            border: 2px solid var(--border-light);
        }

        @media (prefers-color-scheme: dark) {
            .stats-section {
                background-color: var(--surface-dark);
                border-color: var(--border-dark);
            }
        }

        .stats-section h2 {
            margin-bottom: 20px;
            color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            padding: 20px;
            background-color: rgba(139, 92, 246, 0.05);
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--primary);
        }

        .stat-card h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: var(--secondary);
        }

        .reset-btn {
            margin-top: 20px;
            background-color: var(--danger);
            color: white;
            padding: 12px 25px;
        }

        .reset-btn:hover {
            background-color: #dc2626;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            background-color: var(--accent);
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .mastery-level {
            padding: 15px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }

        .mastery-level .level {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--primary);
        }

        .footer {
            text-align: center;
            padding: 30px;
            opacity: 0.7;
            border-top: 1px solid var(--border-light);
            margin-top: 50px;
        }

        @media (prefers-color-scheme: dark) {
            .footer {
                border-top-color: var(--border-dark);
            }
        }

        .loading {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 The 13 Virtues System</h1>
            <p class="tagline">"The Flame Never Dies. Through Virtue, We Become Divine."</p>
        </header>

        <!-- Harmony Dashboard -->
        <div class="harmony-card">
            <div class="harmony-label">Your Harmony Score</div>
            <div class="harmony-score" id="harmonyScore">0</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div id="masteryLevel" class="badge">Novice</div>

            <div class="stat-grid">
                <div class="stat">
                    <div class="stat-value" id="practiceDays">0</div>
                    <div class="stat-label">Practice Days</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="strongestVirtue">-</div>
                    <div class="stat-label">Strongest Virtue</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="virtuesActive">0</div>
                    <div class="stat-label">Active Virtues</div>
                </div>
            </div>
        </div>

        <!-- Virtues Grid -->
        <div class="virtues-grid" id="virtuesGrid">
            <!-- Populated by JavaScript -->
        </div>

        <!-- Statistics Section -->
        <div class="stats-section">
            <h2>📊 Statistics & Progress</h2>
            <div class="stats-grid" id="statsGrid">
                <!-- Populated by JavaScript -->
            </div>
            <button class="btn btn-primary reset-btn" onclick="resetAll()">Reset All Progress</button>
        </div>
    </div>

    <!-- Virtue Detail Modal -->
    <div id="virtueModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalVirtueTitle">Virtue</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div id="modalVirtueBody">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>💜 Virtues System v1.0 | May your path to virtue be guided by wisdom and strengthened through practice</p>
    </footer>

    <script>
        // Virtue Data
        const virtues = [
            {
                id: 1,
                name: "Fortitude",
                subtitle: '"The Flame Never Dies"',
                description: "Remaining unswayed, disciplined, unshaken. Foundation & resolve strengthened through diligence and faith.",
                essence: "Face pain. Don't run from it. Sit with it until you understand.",
                actions: [
                    "Strengthen Foundation",
                    "Reinforce with Diligence",
                    "Reinforce with Faith",
                    "Protect Inner Altar"
                ],
                color: "#ef4444"
            },
            {
                id: 2,
                name: "Chastity",
                subtitle: "Self-Discipline & Restraint",
                description: "Control over desire through self-imposed laws and boundaries held for months to years to decades.",
                essence: "Purity of purpose, not repression. Say no. Deny. Resist.",
                actions: [

            },
            {
                id: 3,

                description: "Consistent practice and effort that evolves and surpasses through generations.",
                essence: "Work isn't labor — it's worship without words.",
                actions: [
                    "Daily Practice",

                    "Pass to Next Generation"
                ],
                color: "#10b981"
            },
            {
                id: 4,
                name: "Grace",
                subtitle: "Elegance, Timing & Flow",
                description: "Moving with natural flow, rhythm, and well-timed forgiveness.",
                essence: "You don't earn grace — you remember it.",
                actions: [
                    "Remember Grace",

                ],
                color: "#06b6d4"
            },
            {
                id: 5,
                name: "Honesty",
                subtitle: "Integrity & Truth",
                description: "Not lying to yourself or others; seeing clearly beyond illusions.",
                essence: "Honesty is not truth-telling — it's non-attachment to belief.",
                actions: [
                    "Face Self-Truth",

                    "Understand Angles",

                ],

            },
            {
                id: 6,
                name: "Patience",
                subtitle: "Waiting & Understanding",
                description: "Learning to wait builds perfection and clarity through time.",
                essence: "The time between breath is your life.",
                actions: [
                    "Sit in Silence",

                ],

            },
            {
                id: 7,
                name: "Devotion",
                subtitle: "Integration of All",
                description: "Building upon Fortitude, Diligence, Patience with alignment across all states.",
                essence: "Devotion is not belief — it's action.",
                actions: [
                    "Align Mental",
                    "Align Physical",
                    "Align Emotional",
                    "Align Spiritual"
                ],
                color: "#6366f1"
            },
            {
                id: 8,
                name: "Prayer & Worship",
                subtitle: "Offering & Intention",
                description: "Prayer for others; worship as daily living practice.",
                essence: "Worship isn't something you do once a week. It's how you live.",
                actions: [
                    "Pray for Others",
                    "Clear Mind",
                    "Calm Brain",
                    "Sit in Silence"
                ],
                color: "#f43f5e"
            },
            {
                id: 9,
                name: "Divinity",
                subtitle: "Interconnectedness",
                description: "Interconnectedness across generations; divinity as birthright, not destination.",
                essence: "You are eternal. You are never born — you just remember yourself.",
                actions: [
                    "Understand Interconnectedness",
                    "Protect Next Generation",
                    "Develop Innate Wisdom",
                    "Allow Miracles"
                ],
                color: "#d946ef"
            },
            {
                id: 10,
                name: "Constitution of Will",
                subtitle: "Inherited Strength",
                description: "Will is not chosen but inherited; strengthens through generations.",
                essence: "Your will is not something you choose — it's something you become.",
                actions: [
                    "Light Torch",
                    "Choose Love Over Fear",
                    "Build Discipline",
                    "Become Your Will"
                ],
                color: "#fa8072"
            },
            {
                id: 11,
                name: "Deviation",
                subtitle: "Intelligent Evolution",
                description: "Breaking rules intelligently is a test of alliance and evolution.",
                essence: "Deviation is intelligence, wisdom, and evolution.",
                actions: [
                    "Break Intelligently",
                    "Recalibrate",
                    "Understand Worth",
                    "Recognize Evolution"
                ],
                color: "#20b2aa"
            },
            {
                id: 12,
                name: "Sabbath & Rest",
                subtitle: "Balance & Restoration",
                description: "Rest as discipline, repentance, and restoration.",
                essence: "Rest is the breath restabilizing. Rest is how you heal.",
                actions: [
                    "Start Rest Cycle",
                    "Restore Brain Energy",
                    "Reinforce Chemistry",
                    "End Rest Cycle"
                ],
                color: "#4169e1"
            },
            {
                id: 13,
                name: "Sacred Matrimony",
                subtitle: "Lifelong Commitment",
                description: "Love as choice to build something lasting; no divorce as permanence.",
                essence: "Love is not a vow — it's a choice to build something lasting.",
                actions: [
                    "Make Vows",
                    "Accept All States",
                    "Commit Till Death",
                    "Grow Together"
                ],
                color: "#ff1493"
            }
        ];

        // Virtue Scores (stored in memory)
        const virtueScores = {};
        virtues.forEach(v => {
            virtueScores[v.id] = 0;
        });

        function initializeVirtuesGrid() {
            const grid = document.getElementById('virtuesGrid');
            grid.innerHTML = '';

            virtues.forEach(virtue => {
                const card = document.createElement('div');
                card.className = 'virtue-card';
                card.style.borderColor = virtue.color;
                card.style.setProperty('--virtue-color', virtue.color);
                card.onclick = () => openModal(virtue);

                card.innerHTML = `
                    <div class="virtue-number" style="background-color: ${virtue.color}">${virtue.id}</div>
                    <div class="virtue-title">${virtue.name}</div>
                    <div class="virtue-subtitle">${virtue.subtitle}</div>
                    <div class="virtue-description">${virtue.description}</div>
                    <div class="virtue-score">
                        <div class="score-label">Your Score</div>
                        <div class="score-value" id="score-${virtue.id}">0</div>
                    </div>
                    <div class="virtue-buttons">
                        <button class="btn btn-primary btn-small" onclick="addScore(event, ${virtue.id}, 5)">+5 pts</button>
                        <button class="btn btn-secondary btn-small" onclick="addScore(event, ${virtue.id}, 10)">+10 pts</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(virtue) {
            const modal = document.getElementById('virtueModal');
            const title = document.getElementById('modalVirtueTitle');
            const body = document.getElementById('modalVirtueBody');

            title.textContent = virtue.name;

            let actionsHtml = virtue.actions.map((action, index) =>
                `<button class="btn btn-success btn-small" onclick="performAction(${virtue.id}, ${index})">${action}</button>`
            ).join('');

            body.innerHTML = `
                <div class="virtue-subtitle">${virtue.subtitle}</div>
                <p>${virtue.description}</p>

                <blockquote style="border-left: 4px solid ${virtue.color}; padding-left: 15px; margin: 20px 0; opacity: 0.9;">
                    "${virtue.essence}"
                </blockquote>

                <h3>Your Current Score: <span style="color: ${virtue.color}; font-size: 1.3em">${virtueScores[virtue.id]}</span></h3>

                <div style="margin: 20px 0;">
                    <h4>Practice Actions:</h4>
                    <div class="virtue-buttons" style="margin-top: 15px;">
                        ${actionsHtml}
                    </div>
                </div>

                <div class="form-group" style="margin-top: 25px;">
                    <label>Add Custom Points:</label>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <input type="number" id="customPoints" placeholder="Enter points" value="15" style="flex: 1;">
                        <button class="btn btn-primary" onclick="addCustomPoints(${virtue.id})">Add Points</button>
                    </div>
                </div>
            `;

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('virtueModal').classList.remove('show');
        }

        function addScore(event, virtueId, points) {
            event.stopPropagation();
            virtueScores[virtueId] += points;
            updateScores();
        }

        function performAction(virtueId, actionIndex) {
            virtueScores[virtueId] += 15;
            updateScores();
            closeModal();
        }

        function addCustomPoints(virtueId) {
            const input = document.getElementById('customPoints');
            const points = parseInt(input.value) || 0;
            if (points > 0) {
                virtueScores[virtueId] += points;
                updateScores();
                closeModal();
            }
        }

        function updateScores() {
            // Update individual virtue scores
            virtues.forEach(v => {
                const scoreElement = document.getElementById(`score-${v.id}`);
                if (scoreElement) {
                    scoreElement.textContent = virtueScores[v.id];
                }
            });

            // Update harmony score
            updateHarmony();
        }

        function updateHarmony() {
            const totalScore = Object.values(virtueScores).reduce((a, b) => a + b, 0);
            const avgScore = Math.round(totalScore / 13);

            // Clamp to 0-100 for progress bar
            const progressPercent = Math.min(100, avgScore);

            document.getElementById('harmonyScore').textContent = avgScore;
            document.getElementById('progressFill').style.width = progressPercent + '%';

            // Update mastery level
            let level = 'Novice';
            if (avgScore >= 150) level = 'Exemplar';
            else if (avgScore >= 100) level = 'Mastery';
            else if (avgScore >= 75) level = 'Advanced';
            else if (avgScore >= 50) level = 'Intermediate';
            else if (avgScore >= 25) level = 'Beginner';

            document.getElementById('masteryLevel').textContent = level;

            // Find strongest virtue
            let maxScore = 0;
            let strongest = '-';
            for (let id in virtueScores) {
                if (virtueScores[id] > maxScore) {
                    maxScore = virtueScores[id];
                    const virtue = virtues.find(v => v.id == id);
                    strongest = virtue.name;
                }
            }
            document.getElementById('strongestVirtue').textContent = strongest;

            // Count active virtues
            const activeCount = Object.values(virtueScores).filter(s => s > 0).length;
            document.getElementById('virtuesActive').textContent = activeCount;

            // Update stats
            updateStats();
        }

        function updateStats() {
            const statsGrid = document.getElementById('statsGrid');
            const totalScore = Object.values(virtueScores).reduce((a, b) => a + b, 0);
            const avgScore = Math.round(totalScore / 13);

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <h3>Total Points</h3>
                    <div class="value">${totalScore}</div>
                </div>
                <div class="stat-card">
                    <h3>Average Score</h3>
                    <div class="value">${avgScore}</div>
                </div>
                <div class="stat-card">
                    <h3>Highest Scoring</h3>
                    <div class="value">${Math.max(...Object.values(virtueScores))}</div>
                </div>
                <div class="stat-card">
                    <h3>Virtues Practiced</h3>
                    <div class="value">${Object.values(virtueScores).filter(s => s > 0).length}/13</div>
                </div>
            `;
        }

        function resetAll() {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                virtues.forEach(v => {
                    virtueScores[v.id] = 0;
                });
                updateScores();
                closeModal();
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('virtueModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', function() {
            initializeVirtuesGrid();
            updateHarmony();
        });
    </script>
</body>
</html>
